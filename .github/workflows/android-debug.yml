name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rustore/capacitor-android-setup
      - rustore/app-icon
      - rustore/fix-launcher-icon
      - rustore/fix-round-launcher-icon

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run prepare:web
      - name: Add Android platform
        run: npx cap add android
      - name: Install app launcher icon
        run: node scripts/install-android-icon.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Verify launcher icon resources
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          grep -q 'ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mamchkin-papchkin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
